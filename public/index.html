<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام مدرسة النور المتكامل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .nav-item { transition: all 0.2s; cursor: pointer; }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: rgba(255,255,255,0.2); border-right: 4px solid #fbbf24; }
    .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .btn-add { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; margin: 0 2px; cursor: pointer; border: none; }
    .btn-edit { background: #3b82f6; color: white; }
    .btn-delete { background: #ef4444; color: white; }
    .form-input { width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 8px; margin-bottom: 15px; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 15px 30px; border-radius: 10px; z-index: 2000; display: none; font-weight: bold; }
    .toast.show { display: block; animation: slideDown 0.3s; }
    @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
  </style>
</head>
<body class="bg-gray-100">
  <div id="toast" class="toast"></div>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 id="modal-title" class="text-xl font-bold"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
      </div>
      <form id="modal-form"></form>
    </div>
  </div>

  <div class="flex h-screen">
    <div class="w-64 bg-gradient-to-b from-blue-900 to-blue-800 text-white flex flex-col flex-shrink-0 shadow-xl">
      <div class="p-6 border-b border-blue-700">
        <h1 class="text-2xl font-bold">🏫 مدرسة النور</h1>
        <p class="text-blue-200 text-xs mt-1">نظام الإدارة المتكامل</p>
      </div>
      <nav class="mt-4 flex-1 text-sm overflow-y-auto" id="sidebar-nav"></nav>
      <div class="p-4 border-t border-blue-700 bg-blue-900/50">
        <div class="flex items-center mb-3">
          <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center">👤</div>
          <div class="mr-3 flex-1 overflow-hidden">
            <p class="text-sm font-semibold truncate" id="user-name">المستخدم</p>
            <span class="text-[10px] bg-yellow-500 text-black px-2 py-0.5 rounded-full font-bold" id="user-role">مدير</span>
          </div>
        </div>
        <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg text-sm font-semibold">🚪 تسجيل الخروج</button>
      </div>
    </div>

    <div class="flex-1 overflow-auto bg-gray-50">
      <div class="bg-white shadow-sm px-6 py-4 sticky top-0 z-10 flex justify-between items-center">
        <h2 id="page-title" class="text-2xl font-bold text-gray-800">لوحة التحكم</h2>
        <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full" id="current-date"></span>
      </div>
      <div id="main-content" class="p-6"></div>
    </div>
  </div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    if (!currentUser || !currentUser.role) window.location.href = '/login';
    const userRole = currentUser.role;
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const menuItems = {
      'مدير': [
        {id:'dashboard', icon:'📊', label:'لوحة التحكم'},
        {id:'students', icon:'👥', label:'الطلاب'},
        {id:'teachers', icon:'👨‍🏫', label:'المعلمون'},
        {id:'employees', icon:'👔', label:'الموظفون'},
        {id:'parents', icon:'👨‍👩‍👧', label:'أولياء الأمور'},
        {id:'subjects', icon:'📚', label:'المواد'},
        {id:'schedules', icon:'🕐', label:'جدول الحصص'},
        {id:'attendance', icon:'📅', label:'الحضور'},
        {id:'exams', icon:'📝', label:'الامتحانات'},
        {id:'grades', icon:'🎯', label:'الدرجات'},
        {id:'certificates', icon:'🎓', label:'الشهادات'},
        {id:'fees', icon:'💰', label:'الرسوم'},
        {id:'revenue', icon:'💵', label:'الإيرادات'},
        {id:'expenses', icon:'💸', label:'المصروفات'},
        {id:'transport', icon:'🚌', label:'النقل'},
        {id:'clinic', icon:'🏥', label:'العيادة'},
        {id:'library', icon:'📖', label:'المكتبة'},
        {id:'inventory', icon:'🏪', label:'المخازن'},
        {id:'calendar', icon:'📆', label:'التقويم'},
        {id:'audit', icon:'📋', label:'سجل النشاط'},
        {id:'reports', icon:'📄', label:'التقارير'}
      ],
      'تسجيل الطلاب': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'},{id:'students', icon:'👥', label:'الطلاب'},{id:'parents', icon:'👨‍👩‍👧', label:'أولياء الأمور'},{id:'attendance', icon:'📅', label:'الحضور'}],
      'التقارير': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'},{id:'reports', icon:'📄', label:'التقارير'},{id:'certificates', icon:'🎓', label:'الشهادات'}],
      'الشؤون المالية': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'},{id:'fees', icon:'💰', label:'الرسوم'},{id:'revenue', icon:'💵', label:'الإيرادات'},{id:'expenses', icon:'💸', label:'المصروفات'}]
    };

    const tableConfigs = {
      students: { title: 'الطلاب', columns: [{key:'name', label:'الاسم'}, {key:'grade', label:'الصف'}, {key:'section', label:'الشعبة'}, {key:'phone', label:'الهاتف'}, {key:'status', label:'الحالة'}], form: [{name:'name', label:'الاسم', type:'text'}, {name:'grade', label:'الصف', type:'text'}, {name:'section', label:'الشعبة', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'gender', label:'النوع', type:'select', options:['ذكر','أنثى']}, {name:'birth_date', label:'تاريخ الميلاد', type:'date'}, {name:'status', label:'الحالة', type:'select', options:['نشط','متوقف','متخرج']}] },
      teachers: { title: 'المعلمون', columns: [{key:'name', label:'الاسم'}, {key:'subject', label:'المادة'}, {key:'phone', label:'الهاتف'}, {key:'salary', label:'الراتب'}], form: [{name:'name', label:'الاسم', type:'text'}, {name:'subject', label:'المادة', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'email', label:'البريد', type:'email'}, {name:'salary', label:'الراتب', type:'number'}] },
      employees: { title: 'الموظفون', columns: [{key:'name', label:'الاسم'}, {key:'role', label:'الوظيفة'}, {key:'phone', label:'الهاتف'}, {key:'salary', label:'الراتب'}], form: [{name:'name', label:'الاسم', type:'text'}, {name:'role', label:'الوظيفة', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'email', label:'البريد', type:'email'}, {name:'salary', label:'الراتب', type:'number'}] },
      parents: { title: 'أولياء الأمور', columns: [{key:'name', label:'الاسم'}, {key:'phone', label:'الهاتف'}, {key:'email', label:'البريد'}, {key:'job', label:'الوظيفة'}], form: [{name:'name', label:'الاسم', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'email', label:'البريد', type:'email'}, {name:'job', label:'الوظيفة', type:'text'}, {name:'address', label:'العنوان', type:'text'}] },
      subjects: { title: 'المواد', columns: [{key:'name', label:'المادة'}, {key:'code', label:'الكود'}, {key:'grade', label:'الصف'}], form: [{name:'name', label:'المادة', type:'text'}, {name:'code', label:'الكود', type:'text'}, {name:'grade', label:'الصف', type:'text'}] },
      schedules: { title: 'جدول الحصص', columns: [{key:'day', label:'اليوم'}, {key:'period', label:'الحصة'}, {key:'subject', label:'المادة'}, {key:'teacher', label:'المعلم'}, {key:'room', label:'القاعة'}], form: [{name:'day', label:'اليوم', type:'select', options:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس']}, {name:'period', label:'رقم الحصة', type:'number'}, {name:'subject', label:'المادة', type:'text'}, {name:'teacher', label:'المعلم', type:'text'}, {name:'section', label:'الشعبة', type:'text'}, {name:'room', label:'القاعة', type:'text'}] },
      attendance: { title: 'الحضور', columns: [{key:'student_name', label:'الطالب'}, {key:'date', label:'التاريخ'}, {key:'status', label:'الحالة'}], form: [{name:'student_name', label:'الطالب', type:'text'}, {name:'date', label:'التاريخ', type:'date'}, {name:'status', label:'الحالة', type:'select', options:['present','absent','late']}] },
      exams: { title: 'الامتحانات', columns: [{key:'name', label:'الامتحان'}, {key:'subject', label:'المادة'}, {key:'date', label:'التاريخ'}, {key:'max_score', label:'الدرجة'}, {key:'status', label:'الحالة'}], form: [{name:'name', label:'الامتحان', type:'text'}, {name:'subject', label:'المادة', type:'text'}, {name:'grade', label:'الصف', type:'text'}, {name:'date', label:'التاريخ', type:'date'}, {name:'max_score', label:'الدرجة الكاملة', type:'number'}, {name:'status', label:'الحالة', type:'select', options:['قادم','مكتمل','ملغي']}] },
      grades: { title: 'الدرجات', columns: [{key:'student_name', label:'الطالب'}, {key:'subject', label:'المادة'}, {key:'score', label:'الدرجة'}, {key:'max_score', label:'من'}, {key:'exam_type', label:'النوع'}], form: [{name:'student_name', label:'الطالب', type:'text'}, {name:'subject', label:'المادة', type:'text'}, {name:'score', label:'الدرجة', type:'number'}, {name:'max_score', label:'من', type:'number'}, {name:'exam_type', label:'نوع الامتحان', type:'text'}, {name:'term', label:'الترم', type:'select', options:['الأول','الثاني']}] },
      fees: { title: 'الرسوم', columns: [{key:'student_name', label:'الطالب'}, {key:'amount', label:'المبلغ'}, {key:'type', label:'النوع'}, {key:'status', label:'الحالة'}], form: [{name:'student_name', label:'الطالب', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'type', label:'النوع', type:'text'}, {name:'due_date', label:'تاريخ الاستحقاق', type:'date'}, {name:'status', label:'الحالة', type:'select', options:['paid','unpaid','partial']}] },
      revenue: { title: 'الإيرادات', columns: [{key:'source', label:'المصدر'}, {key:'amount', label:'المبلغ'}, {key:'date', label:'التاريخ'}], form: [{name:'source', label:'المصدر', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'date', label:'التاريخ', type:'date'}, {name:'notes', label:'ملاحظات', type:'text'}] },
      expenses: { title: 'المصروفات', columns: [{key:'category', label:'البند'}, {key:'amount', label:'المبلغ'}, {key:'date', label:'التاريخ'}], form: [{name:'category', label:'البند', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'date', label:'التاريخ', type:'date'}, {name:'notes', label:'ملاحظات', type:'text'}] },
      transport: { title: 'النقل', columns: [{key:'bus_name', label:'الباص'}, {key:'route', label:'المسار'}, {key:'driver', label:'السائق'}, {key:'students_count', label:'الطلاب'}], form: [{name:'bus_name', label:'الباص', type:'text'}, {name:'route', label:'المسار', type:'text'}, {name:'driver', label:'السائق', type:'text'}, {name:'driver_phone', label:'هاتف السائق', type:'text'}, {name:'capacity', label:'السعة', type:'number'}, {name:'students_count', label:'عدد الطلاب', type:'number'}] },
      clinic: { title: 'العيادة', columns: [{key:'student_name', label:'الطالب'}, {key:'date', label:'التاريخ'}, {key:'complaint', label:'الشكوى'}, {key:'treatment', label:'العلاج'}], form: [{name:'student_name', label:'الطالب', type:'text'}, {name:'date', label:'التاريخ', type:'date'}, {name:'complaint', label:'الشكوى', type:'text'}, {name:'treatment', label:'العلاج', type:'text'}, {name:'notes', label:'ملاحظات', type:'text'}] },
      library: { title: 'المكتبة', columns: [{key:'book_title', label:'العنوان'}, {key:'author', label:'المؤلف'}, {key:'category', label:'الفئة'}, {key:'status', label:'الحالة'}], form: [{name:'book_title', label:'العنوان', type:'text'}, {name:'author', label:'المؤلف', type:'text'}, {name:'isbn', label:'ISBN', type:'text'}, {name:'category', label:'الفئة', type:'text'}, {name:'status', label:'الحالة', type:'select', options:['متاح','معار','تالف']}] },
      inventory: { title: 'المخازن', columns: [{key:'item_name', label:'الصنف'}, {key:'category', label:'الفئة'}, {key:'quantity', label:'الكمية'}, {key:'location', label:'الموقع'}], form: [{name:'item_name', label:'الصنف', type:'text'}, {name:'category', label:'الفئة', type:'text'}, {name:'quantity', label:'الكمية', type:'number'}, {name:'unit', label:'الوحدة', type:'text'}, {name:'location', label:'الموقع', type:'text'}] },
      calendar: { title: 'التقويم', table: 'calendar_events', columns: [{key:'title', label:'العنوان'}, {key:'date', label:'التاريخ'}, {key:'type', label:'النوع'}], form: [{name:'title', label:'العنوان', type:'text'}, {name:'date', label:'التاريخ', type:'date'}, {name:'type', label:'النوع', type:'select', options:['أكاديمي','امتحان','عطلة','فعالية']}, {name:'description', label:'الوصف', type:'text'}] },
      audit: { title: 'سجل النشاط', columns: [{key:'user_name', label:'المستخدم'}, {key:'action', label:'العملية'}, {key:'details', label:'التفاصيل'}, {key:'date', label:'التاريخ'}], form: [], noAdd: true }
    };

    let currentTable = null, currentEditId = null;

    function buildSidebar() {
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-role').textContent = userRole;
      const nav = document.getElementById('sidebar-nav');
      const items = menuItems[userRole] || menuItems['مدير'];
      nav.innerHTML = items.map((item, i) => 
        `<a onclick="showPage('${item.id}')" class="nav-item ${i===0?'active':''} flex items-center px-6 py-3 text-blue-100">
          <span class="ml-3 text-lg">${item.icon}</span> ${item.label}
        </a>`
      ).join('');
    }

    function showPage(pageId) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const activeLink = Array.from(document.querySelectorAll('.nav-item')).find(a => a.textContent.includes(
        (menuItems[userRole] || menuItems['مدير']).find(m => m.id === pageId)?.label || ''
      ));
      if (activeLink) activeLink.classList.add('active');

      const contentDiv = document.getElementById('main-content');
      const titles = {dashboard:'لوحة التحكم', reports:'التقارير', certificates:'الشهادات'};
      document.getElementById('page-title').textContent = titles[pageId] || tableConfigs[pageId]?.title || '';

      if (pageId === 'dashboard') renderDashboard();
      else if (pageId === 'reports') renderReports();
      else if (pageId === 'certificates') renderCertificates();
      else if (tableConfigs[pageId]) {
        currentTable = pageId;
        const config = tableConfigs[pageId];
        const actualTable = config.table || pageId;
        contentDiv.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="text-xl font-bold">إدارة ${config.title}</h3>
              ${!config.noAdd ? `<button onclick="openModal()" class="btn-add">+ إضافة جديد</button>` : ''}
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50"><tr>
                  ${config.columns.map(c => `<th class="px-4 py-3 text-right font-semibold text-gray-600">${c.label}</th>`).join('')}
                  <th class="px-4 py-3 text-right font-semibold text-gray-600">الإجراءات</th>
                </tr></thead>
                <tbody id="dynamic-table-body">
                  <tr><td colspan="100" class="text-center py-8 text-gray-500">جاري التحميل...</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
        loadData(actualTable);
      }
    }

    async function renderDashboard() {
      const contentDiv = document.getElementById('main-content');
      contentDiv.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-blue-500"><p class="text-gray-500 text-sm">الطلاب</p><p class="text-3xl font-bold mt-2" id="dash-students">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-green-500"><p class="text-gray-500 text-sm">المعلمون</p><p class="text-3xl font-bold mt-2" id="dash-teachers">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-yellow-500"><p class="text-gray-500 text-sm">الإيرادات</p><p class="text-3xl font-bold mt-2" id="dash-revenue">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-purple-500"><p class="text-gray-500 text-sm">الحضور</p><p class="text-3xl font-bold mt-2" id="dash-attendance">...</p></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-pink-500"><p class="text-gray-500 text-sm">الموظفون</p><p class="text-3xl font-bold mt-2" id="dash-employees">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-indigo-500"><p class="text-gray-500 text-sm">المصروفات</p><p class="text-3xl font-bold mt-2" id="dash-expenses">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-orange-500"><p class="text-gray-500 text-sm">الباصات</p><p class="text-3xl font-bold mt-2" id="dash-transport">...</p></div>
          <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-teal-500"><p class="text-gray-500 text-sm">الكتب</p><p class="text-3xl font-bold mt-2" id="dash-library">...</p></div>
        </div>`;
      
      const stats = [
        {table:'students', id:'dash-students', type:'count'},
        {table:'teachers', id:'dash-teachers', type:'count'},
        {table:'employees', id:'dash-employees', type:'count'},
        {table:'revenue', id:'dash-revenue', type:'sum', key:'amount'},
        {table:'expenses', id:'dash-expenses', type:'sum', key:'amount'},
        {table:'attendance', id:'dash-attendance', type:'count'},
        {table:'transport', id:'dash-transport', type:'count'},
        {table:'library', id:'dash-library', type:'count'}
      ];
      
      for (const s of stats) {
        try {
          const res = await fetch(`/api/${s.table}`);
          const data = await res.json();
          const el = document.getElementById(s.id);
          if (el && data.success) {
            if (s.type === 'sum') {
              const total = data.data.reduce((sum, item) => sum + (Number(item[s.key]) || 0), 0);
              el.textContent = total.toLocaleString() + ' ج';
            } else {
              el.textContent = data.count;
            }
          }
        } catch(e) {}
      }
    }

    function renderReports() {
      const reports = [
        {url:'/api/reports/students', icon:'👥', title:'تقرير الطلاب', color:'from-blue-500 to-blue-600'},
        {url:'/api/reports/teachers', icon:'👨‍🏫', title:'تقرير المعلمين', color:'from-green-500 to-green-600'},
        {url:'/api/reports/employees', icon:'👔', title:'تقرير الموظفين', color:'from-purple-500 to-purple-600'},
        {url:'/api/reports/attendance', icon:'📅', title:'تقرير الحضور', color:'from-pink-500 to-pink-600'},
        {url:'/api/reports/grades', icon:'🎯', title:'كشوف الدرجات', color:'from-indigo-500 to-indigo-600'},
        {url:'/api/reports/fees', icon:'💰', title:'التقرير المالي', color:'from-yellow-500 to-yellow-600'},
        {url:'/api/reports/financial', icon:'💵', title:'التقرير الشامل', color:'from-orange-500 to-orange-600'},
        {url:'/api/reports/transport', icon:'🚌', title:'تقرير النقل', color:'from-teal-500 to-teal-600'},
        {url:'/api/reports/schedules', icon:'🕐', title:'جدول الحصص', color:'from-red-500 to-red-600'}
      ];
      document.getElementById('main-content').innerHTML = `
        <div class="bg-white rounded-xl shadow-sm p-6">
          <h3 class="text-xl font-bold mb-6">📄 التقارير المتاحة</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${reports.map(r => `
              <a href="${r.url}" target="_blank" class="bg-gradient-to-br ${r.color} text-white p-6 rounded-xl hover:shadow-lg transition flex flex-col items-center text-center">
                <span class="text-5xl mb-3">${r.icon}</span>
                <h4 class="font-bold text-lg">${r.title}</h4>
              </a>
            `).join('')}
          </div>
        </div>`;
    }

    async function renderCertificates() {
      try {
        const res = await fetch('/api/students');
        const data = await res.json();
        if (!data.success) {
          document.getElementById('main-content').innerHTML = '<div class="bg-red-50 p-6 rounded-xl text-red-700">⛔ ' + data.message + '</div>';
          return;
        }
        document.getElementById('main-content').innerHTML = `
          <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-xl font-bold mb-6">🎓 شهادات الطلاب</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${data.data.length ? data.data.map(s => `
                <a href="/certificate/${s.id}" target="_blank" class="bg-gradient-to-br from-blue-500 to-purple-600 text-white p-6 rounded-xl hover:shadow-xl transition">
                  <div class="text-4xl mb-2">🎓</div>
                  <h4 class="font-bold text-lg">${s.name}</h4>
                  <p class="text-sm opacity-90">${s.grade} - ${s.section}</p>
                  <div class="mt-4 bg-white text-blue-600 px-4 py-2 rounded-lg text-sm font-semibold text-center">عرض الشهادة</div>
                </a>
              `).join('') : '<p class="text-gray-500 col-span-3 text-center py-8">لا يوجد طلاب</p>'}
            </div>
          </div>`;
      } catch(e) {
        document.getElementById('main-content').innerHTML = '<div class="bg-red-50 p-6 rounded-xl text-red-700">❌ خطأ</div>';
      }
    }

    async function loadData(table) {
      try {
        const res = await fetch(`/api/${table}`);
        const data = await res.json();
        const tbody = document.getElementById('dynamic-table-body');
        if (!tbody) return;
        
        if (!data.success) {
          tbody.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-red-500">⛔ ${data.message}</td></tr>`;
          return;
        }

        const config = tableConfigs[currentTable];
        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-gray-500">لا توجد بيانات</td></tr>`;
          return;
        }

        tbody.innerHTML = data.data.map(row => `
          <tr class="border-b hover:bg-gray-50 transition">
            ${config.columns.map(c => `<td class="px-4 py-3">${row[c.key] || '-'}</td>`).join('')}
            <td class="px-4 py-3">
              ${!config.noAdd ? `
                <button onclick="editItem('${table}', ${row.id})" class="btn-action btn-edit">✏️</button>
                <button onclick="deleteItem('${table}', ${row.id}, '${(row.name || row.student_name || row.book_title || row.bus_name || row.source || row.category || '').replace(/'/g, "\\'")}')" class="btn-action btn-delete">🗑️</button>
              ` : '-'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        const tbody = document.getElementById('dynamic-table-body');
        if (tbody) tbody.innerHTML = `<tr><td colspan="100" class="text-center py-8 text-red-500">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    function openModal(editData = null) {
      const config = tableConfigs[currentTable];
      document.getElementById('modal-title').textContent = editData ? `تعديل ${config.title}` : `إضافة ${config.title}`;
      currentEditId = editData ? editData.id : null;
      
      document.getElementById('modal-form').innerHTML = config.form.map(f => {
        const val = editData ? (editData[f.name] || '') : '';
        if (f.type === 'select') {
          return `<label class="block text-sm font-semibold text-gray-700 mb-1">${f.label}</label>
                  <select name="${f.name}" class="form-input">${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
        }
        return `<label class="block text-sm font-semibold text-gray-700 mb-1">${f.label}</label>
                <input type="${f.type}" name="${f.name}" value="${val}" class="form-input">`;
      }).join('') + `<div class="flex gap-3 mt-6">
        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">💾 حفظ</button>
        <button type="button" onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">إلغاء</button>
      </div>`;
      
      document.getElementById('modal').classList.add('show');
    }

    async function editItem(table, id) {
      try {
        const actualTable = tableConfigs[table].table || table;
        const res = await fetch(`/api/${actualTable}`);
        const data = await res.json();
        const item = data.data.find(r => r.id === id);
        if (item) openModal(item);
      } catch(e) {
        showToast('❌ خطأ', 'error');
      }
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {}; formData.forEach((v, k) => data[k] = v);
      
      const actualTable = tableConfigs[currentTable].table || currentTable;
      const method = currentEditId ? 'PUT' : 'POST';
      const url = currentEditId ? `/api/${actualTable}/${currentEditId}` : `/api/${actualTable}`;
      
      try {
        const res = await fetch(url, { 
          method, 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify(data) 
        });
        const result = await res.json();
        
        if (result.success) {
          showToast(currentEditId ? '✅ تم التعديل' : '✅ تمت الإضافة');
          closeModal();
          loadData(actualTable);
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) {
        showToast('❌ خطأ في الاتصال', 'error');
      }
    });

    async function deleteItem(table, id, name) {
      if (!confirm(`هل أنت متأكد من حذف "${name}"؟`)) return;
      const actualTable = tableConfigs[table].table || table;
      try {
        const res = await fetch(`/api/${actualTable}/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) { 
          showToast('🗑️ تم الحذف'); 
          loadData(actualTable); 
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) {
        showToast('❌ خطأ', 'error');
      }
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; 
      t.style.background = type === 'success' ? '#10b981' : '#ef4444';
      t.classList.add('show'); 
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() { 
      if(confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('user'); 
        window.location.href = '/login'; 
      }
    }

    buildSidebar();
    showPage('dashboard');
  </script>
</body>
</html>
