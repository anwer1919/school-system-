<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | مدرسة النور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .input-group:focus-within label { color: #4f46e5; }
    .input-group:focus-within svg { color: #4f46e5; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- خلفية زخرفية خفيفة -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
  </div>

  <div class="glass-effect w-full max-w-md rounded-3xl shadow-2xl border border-white/20 p-8 relative z-10 transform transition-all hover:scale-[1.01] duration-300">
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-indigo-600 to-blue-600 rounded-2xl mx-auto flex items-center justify-center text-4xl mb-4 shadow-lg shadow-indigo-500/30 rotate-3 hover:rotate-0 transition-transform duration-300">🏫</div>
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">مدرسة النور</h1>
      <p class="text-slate-500 mt-2 font-medium">نظام الإدارة المدرسي المتكامل</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div class="input-group">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5 transition-colors">البريد الإلكتروني</label>
        <div class="relative">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
          </div>
          <input type="email" id="email" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all duration-200 text-slate-700 placeholder-slate-400" placeholder="name@school.com">
        </div>
      </div>

      <div class="input-group">
        <label class="block text-sm font-semibold text-slate-700 mb-1.5 transition-colors">كلمة المرور</label>
        <div class="relative">
          <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-slate-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
          </div>
          <input type="password" id="password" required class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all duration-200 text-slate-700 placeholder-slate-400" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-500/30 transform transition-all duration-200 hover:-translate-y-0.5 active:translate-y-0 mt-2">
        تسجيل الدخول
      </button>
    </form>

    <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-100 text-red-600 rounded-xl text-center font-semibold text-sm flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <span></span>
    </div>

    <div class="mt-8 text-center border-t border-slate-100 pt-6">
      <p class="text-xs text-slate-400 font-medium">© 2026 مدرسة النور النموذجية. جميع الحقوق محفوظة.</p>
    </div>
  </div>

  <script>
    if (localStorage.getItem('user')) window.location.href = '/';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMessage');
      const errorText = errorMsg.querySelector('span');
      
      btn.disabled = true; 
      btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>'; 
      errorMsg.classList.add('hidden');
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          errorText.textContent = data.message;
          errorMsg.classList.remove('hidden');
          btn.disabled = false; 
          btn.textContent = 'تسجيل الدخول';
        }
      } catch (err) {
        errorText.textContent = 'حدث خطأ في الاتصال بالخادم';
        errorMsg.classList.remove('hidden');
        btn.disabled = false; 
        btn.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
