    function buildSidebar() {
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-role').textContent = currentUser.role;
      const nav = document.getElementById('sidebar-nav');
      let items = [];
      if (currentUser.role === 'مدير') items = allMenus;
      else if (menuItems[currentUser.role]) items = menuItems[currentUser.role];
      else if (currentUser.role === 'مخصص') {
        let allowedMenus = currentUser.allowed_menus || [];
        if (typeof allowedMenus === 'string') { try { allowedMenus = JSON.parse(allowedMenus); } catch (e) { allowedMenus = []; } }
        if (!Array.isArray(allowedMenus)) allowedMenus = [];
        items = allowedMenus.length > 0 ? allMenus.filter(m => allowedMenus.includes(m.id)) : [{id:'dashboard', icon:'📊', label:'لوحة التحكم'}];
      }
      if (!items.find(m => m.id === 'dashboard')) items.unshift({id:'dashboard', icon:'📊', label:'لوحة التحكم'});
      nav.innerHTML = items.map((item, i) => 
        `<a onclick="showPage('${item.id}'); if(window.innerWidth < 768) toggleSidebar();" class="nav-item ${i===0?'active':''} flex items-center px-4 py-3 rounded-xl text-slate-300 hover:text-white">
          <span class="ml-3 text-lg">${item.icon}</span> <span class="font-medium">${item.label}</span>
        </a>`
      ).join('');
    }

    function showPage(pageId) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const activeLink = Array.from(document.querySelectorAll('.nav-item')).find(a => a.textContent.includes(allMenus.find(m => m.id === pageId)?.label || ''));
      if (activeLink) activeLink.classList.add('active');
      const contentDiv = document.getElementById('main-content');
      const titles = {dashboard:'لوحة التحكم', reports:'التقارير', certificates:'الشهادات', users:'إدارة المستخدمين', schedules:'جدول الحصص', 'manage-schedules':'إدارة الحصص', 'student-records':'سجلات الطلاب', 'teacher-records':'سجلات المعلمين', 'employee-records':'سجلات الموظفين', cards:'البطاقات'};
      document.getElementById('page-title').textContent = titles[pageId] || tableConfigs[pageId]?.title || '';
      if (pageId === 'dashboard') renderDashboard();
      else if (pageId === 'reports') renderReports();
      else if (pageId === 'schedules') renderSchedules();
      else if (pageId === 'manage-schedules') renderManageSchedules();
      else if (pageId === 'student-records') renderStudentRecords();
      else if (pageId === 'teacher-records') renderTeacherRecords();
      else if (pageId === 'employee-records') renderEmployeeRecords();
      else if (pageId === 'cards') renderCards();
      else if (pageId === 'certificates') renderCertificates();
      else if (pageId === 'users') {

        else contentDiv.innerHTML = '<div class="bg-red-50 border border-red-100 p-6 rounded-2xl text-red-600 font-semibold">⛔ ليس لديك صلاحية</div>';

      try {
        const res = await fetch('/api/users'); const data = await res.json(); const tbody = document.getElementById('users-table-body');
        if (!data.success || !data.data || data.data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-12 text-slate-400">لا يوجد مستخدمين</td></tr>'; return; }
        tbody.innerHTML = data.data.map(function(u) {
          const rc = { 'مدير': 'bg-purple-100 text-purple-700', 'تسجيل الطلاب': 'bg-blue-100 text-blue-700', 'التقارير': 'bg-green-100 text-green-700', 'الشؤون المالية': 'bg-amber-100 text-amber-700', 'مخصص': 'bg-slate-100 text-slate-700' };
          return '<tr class="hover:bg-slate-50 transition"><td class="px-4 py-4 font-semibold">' + u.name + '</td><td class="px-4 py-4 text-slate-600">' + u.email + '</td><td class="px-4 py-4"><span class="px-3 py-1 rounded-full text-xs font-bold ' + (rc[u.role] || 'bg-slate-100 text-slate-700') + '">' + u.role + '</span></td><td class="px-4 py-4 text-slate-600">' + (u.phone || '-') + '</td><td class="px-4 py-4">' + (u.status === 'active' ? '<span class="status-badge status-active">نشط</span>' : '<span class="status-badge status-inactive">موقوف</span>') + '</td><td class="px-4 py-4"><button onclick="openUserModal(' + u.id + ')" class="btn-action btn-edit">✏️</button>' + (u.id !== currentUser.id ? '<button onclick="deleteUser(' + u.id + ',\'' + u.name + '\')" class="btn-action btn-delete">🗑️</button>' : '') + '</td></tr>';
        }).join('');
      } catch (err) { document.getElementById('users-table-body').innerHTML = '<tr><td colspan="6" class="text-center py-12 text-red-500">❌ خطأ</td></tr>'; }
    }

    function openUserModal(userId) {
      currentEditId = userId || null;
      document.getElementById('modal-title').textContent = userId ? 'تعديل مستخدم' : 'إضافة مستخدم جديد';
      let user = { name: '', email: '', password: '', role: 'مخصص', phone: '', allowed_menus: [] };
      if (userId) { fetch('/api/users').then(function(r) { return r.json(); }).then(function(data) { if (data.success) { user = data.data.find(function(u) { return u.id === userId; }) || user; let am = user.allowed_menus || []; if (typeof am === 'string') { try { am = JSON.parse(am); } catch (e) { am = []; } } user.allowed_menus = am; renderUserForm(user); } }); } else renderUserForm(user);
    }

    function renderUserForm(user) {
      const roles = ['مدير','تسجيل الطلاب','التقارير','الشؤون المالية','مخصص'];
      document.getElementById('modal-form').innerHTML = '<div class="space-y-4"><div><label class="block text-sm font-semibold text-slate-700 mb-1.5">الاسم *</label><input type="text" name="name" value="' + user.name + '" class="form-input" required></div><div><label class="block text-sm font-semibold text-slate-700 mb-1.5">البريد *</label><input type="email" name="email" value="' + user.email + '" class="form-input" required></div><div><label class="block text-sm font-semibold text-slate-700 mb-1.5">' + (currentEditId ? 'كلمة مرور جديدة' : 'كلمة المرور *') + '</label><input type="password" name="password" class="form-input" ' + (!currentEditId ? 'required' : '') + '></div><div><label class="block text-sm font-semibold text-slate-700 mb-1.5">الهاتف</label><input type="text" name="phone" value="' + (user.phone || '') + '" class="form-input"></div><div><label class="block text-sm font-semibold text-slate-700 mb-1.5">الدور *</label><select name="role" id="user-role-select" class="form-input" onchange="toggleCustomMenus()">' + roles.map(function(r) { return '<option value="' + r + '" ' + (user.role === r ? 'selected' : '') + '>' + r + '</option>'; }).join('') + '</select></div><div id="custom-menus-section" style="display:' + (user.role === 'مخصص' ? 'block' : 'none') + '"><label class="block text-sm font-semibold text-slate-700 mb-2">القوائم المسموح بها</label><div class="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto border border-slate-200 rounded-lg p-3">' + allMenus.filter(function(m) { return m.id !== 'users'; }).map(function(m) { return '<label class="flex items-center gap-2 cursor-pointer hover:bg-slate-50 p-2 rounded"><input type="checkbox" name="allowed_menus" value="' + m.id + '" ' + (user.allowed_menus.includes(m.id) ? 'checked' : '') + ' class="rounded"><span class="text-sm">' + m.icon + ' ' + m.label + '</span></label>'; }).join('') + '</div></div>' + (currentEditId ? '<div><label class="block text-sm font-semibold text-slate-700 mb-1.5">الحالة</label><select name="status" class="form-input"><option value="active" ' + (user.status === 'active' ? 'selected' : '') + '>نشط</option><option value="inactive" ' + (user.status === 'inactive' ? 'selected' : '') + '>موقوف</option></select></div>' : '') + '</div><div class="flex flex-col sm:flex-row gap-3 mt-6"><button type="submit" class="btn-primary py-3 text-base flex-1">💾 ' + (currentEditId ? 'تعديل' : 'إضافة') + '</button><button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition">إلغاء</button></div>';
      document.getElementById('modal').classList.add('show');
    }

    function toggleCustomMenus() { document.getElementById('custom-menus-section').style.display = document.getElementById('user-role-select').value === 'مخصص' ? 'block' : 'none'; }

    document.getElementById('modal-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = { name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone'), role: fd.get('role'), status: fd.get('status') || 'active' };
      const pw = fd.get('password'); if (pw) data.password = pw;
      data.allowed_menus = Array.from(document.querySelectorAll('input[name="allowed_menus"]:checked')).map(function(cb) { return cb.value; });
      const method = currentEditId ? 'PUT' : 'POST';
      const url = currentEditId ? '/api/users/' + currentEditId : '/api/users';
      try { const res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); const r = await res.json(); if (r.success) { showToast(currentEditId ? '✅ تم التعديل' : '✅ تمت الإضافة'); closeModal(); loadUsers(); } else showToast('❌ ' + r.message, 'error'); } catch (err) { showToast('❌ خطأ', 'error'); }
    });

    async function deleteUser(id, name) { if (!confirm('حذف "' + name + '"؟')) return; try { const res = await fetch('/api/users/' + id, { method: 'DELETE' }); const r = await res.json(); if (r.success) { showToast('🗑️ تم الحذف'); loadUsers(); } else showToast('❌ ' + r.message, 'error'); } catch (err) { showToast('❌ خطأ', 'error'); } }

    async function loadData(table) {
      try {
        const res = await fetch('/api/' + table); const data = await res.json(); const tbody = document.getElementById('dynamic-table-body');
        if (!tbody) return;
        if (!data.success) { tbody.innerHTML = '<tr><td colspan="100" class="text-center py-12 text-red-500">⛔ ' + data.message + '</td></tr>'; return; }
        const config = tableConfigs[currentTable];
        if (!data.data || data.data.length === 0) { tbody.innerHTML = '<tr><td colspan="100" class="text-center py-12 text-slate-400">لا توجد بيانات</td></tr>'; return; }
        tbody.innerHTML = data.data.map(function(row) {
          return '<tr class="hover:bg-slate-50 transition">' + config.columns.map(function(c) {
            let val = row[c.key] || '-';
            if (c.key === 'status') { if (val === 'نشط' || val === 'paid' || val === 'present') val = '<span class="status-badge status-active">' + (val === 'نشط' ? 'نشط' : val === 'paid' ? 'مدفوع' : 'حاضر') + '</span>'; else if (val === 'متوقف' || val === 'unpaid' || val === 'absent') val = '<span class="status-badge status-inactive">' + (val === 'متوقف' ? 'متوقف' : val === 'unpaid' ? 'غير مدفوع' : 'غائب') + '</span>'; }
            return '<td class="px-4 py-4 text-slate-700 font-medium whitespace-nowrap">' + val + '</td>';
          }).join('') + '<td class="px-4 py-4 whitespace-nowrap">' + (!config.noAdd ? '<button onclick="editItem(\'' + table + '\',' + row.id + ')" class="btn-action btn-edit">✏️</button><button onclick="deleteItem(\'' + table + '\',' + row.id + ',\'' + (row.name || row.student_name || 'سجل').replace(/'/g, "\\'") + '\')" class="btn-action btn-delete">🗑️</button>' : '<span class="text-slate-400 text-xs">سجل</span>') + '</td></tr>';
        }).join('');
      } catch (err) { const tbody = document.getElementById('dynamic-table-body'); if (tbody) tbody.innerHTML = '<tr><td colspan="100" class="text-center py-12 text-red-500">❌ خطأ</td></tr>'; }
    }

    async function openModal(editData) {
      const config = tableConfigs[currentTable];
      currentPhotoUrl = editData ? (editData.photo || null) : null;
      document.getElementById('modal-title').textContent = editData ? 'تعديل: ' + config.title : 'إضافة: ' + config.title;
      currentEditId = editData ? editData.id : null;
      let formHtml = '';
      for (const f of config.form) {
        const val = editData ? (editData[f.name] || '') : '';
        if (f.type === 'select') formHtml += '<label class="block text-sm font-semibold text-slate-700 mb-1.5">' + f.label + '</label><select name="' + f.name + '" class="form-input">' + f.options.map(function(o) { return '<option value="' + o + '" ' + (val === o ? 'selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
        else if (f.type === 'file') formHtml += '<label class="block text-sm font-semibold text-slate-700 mb-1.5">' + f.label + '</label><div id="photo-preview-container" class="mb-2">' + (currentPhotoUrl ? '<img src="' + currentPhotoUrl + '" class="photo-preview">' : '') + '</div><div class="photo-upload-area" onclick="document.getElementById(\'photo-file-input\').click()"><div class="text-3xl mb-2">📷</div><div class="text-sm text-slate-600 font-semibold">اضغط لاختيار صورة</div></div><input type="file" id="photo-file-input" accept="image/*" style="display:none" onchange="previewPhoto(this)"><input type="hidden" name="' + f.name + '" id="photo-url-input" value="' + (currentPhotoUrl || '') + '">';
        else formHtml += '<label class="block text-sm font-semibold text-slate-700 mb-1.5">' + f.label + '</label><input type="' + f.type + '" name="' + f.name + '" value="' + val + '" class="form-input" placeholder="أدخل ' + f.label + '">';
      }
      formHtml += '<div class="flex flex-col sm:flex-row gap-3 mt-6"><button type="submit" class="btn-primary py-3 text-base flex-1">💾 حفظ</button><button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition">إلغاء</button></div>';
      document.getElementById('modal-form').innerHTML = formHtml;
      document.getElementById('modal').classList.add('show');
    }

    function previewPhoto(input) {
      if (input.files && input.files[0]) {
        if (input.files[0].size > 5 * 1024 * 1024) { showToast('❌ حجم الصورة كبير', 'error'); input.value = ''; return; }
        const reader = new FileReader();
        reader.onload = function(e) { document.getElementById('photo-preview-container').innerHTML = '<img src="' + e.target.result + '" class="photo-preview">'; document.getElementById('photo-url-input').value = e.target.result; };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById('modal-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fd = new FormData(e.target); const data = {};
      fd.forEach(function(v, k) { if (k !== 'photo') data[k] = v; });
      const pu = document.getElementById('photo-url-input'); if (pu && pu.value) data.photo = pu.value;
      const at = tableConfigs[currentTable]?.table || currentTable;
      const method = currentEditId ? 'PUT' : 'POST';
      const url = currentEditId ? '/api/' + at + '/' + currentEditId : '/api/' + at;
      try { const res = await fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); const r = await res.json(); if (r.success) { showToast(currentEditId ? '✅ تم التعديل' : '✅ تمت الإضافة'); closeModal(); loadData(at); } else showToast('❌ ' + r.message, 'error'); } catch (err) { showToast('❌ خطأ', 'error'); }
    });

    async function editItem(table, id) { try { const at = tableConfigs[table].table || table; const res = await fetch('/api/' + at); const data = await res.json(); const item = data.data.find(function(r) { return r.id === id; }); if (item) openModal(item); } catch(e) { showToast('❌ خطأ', 'error'); } }

    function closeModal() { document.getElementById('modal').classList.remove('show'); currentPhotoUrl = null; }

    async function deleteItem(table, id, name) { if (!confirm('حذف "' + name + '"؟')) return; const at = tableConfigs[table].table || table; try { const res = await fetch('/api/' + at + '/' + id, { method: 'DELETE' }); const r = await res.json(); if (r.success) { showToast('🗑️ تم الحذف'); loadData(at); } else showToast('❌ ' + r.message, 'error'); } catch (err) { showToast('❌ خطأ', 'error'); } }

    function showToast(msg, type) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + (type === 'error' ? 'error' : ''); setTimeout(function() { t.classList.remove('show'); }, 3000); }

    function logout() { if (confirm('هل تريد تسجيل الخروج؟')) { localStorage.removeItem('user'); window.location.href = '/login'; } }

    buildSidebar();
    showPage('dashboard');
  </script>
</body>
</html>
