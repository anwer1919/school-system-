<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام مدرسة النور المتكامل</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .nav-item { transition: all 0.2s; cursor: pointer; }
    .nav-item:hover { background: rgba(255,255,255,0.1); }
    .nav-item.active { background: rgba(255,255,255,0.2); border-right: 4px solid #fbbf24; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .btn-add { background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-action { padding: 6px 12px; border-radius: 6px; font-size: 12px; margin: 0 2px; cursor: pointer; border: none; }
    .btn-delete { background: #ef4444; color: white; }
    .form-input { width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 8px; margin-bottom: 15px; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 15px 30px; border-radius: 10px; z-index: 2000; display: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .toast.show { display: block; animation: slideDown 0.3s; }
    @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
  </style>
</head>
<body class="bg-gray-100">
  <div id="toast" class="toast"></div>
  
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h3 id="modal-title" class="text-xl font-bold text-gray-800"></h3>
        <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-2xl font-bold">&times;</button>
      </div>
      <form id="modal-form"></form>
    </div>
  </div>

  <div class="flex h-screen">
    <!-- القائمة الجانبية -->
    <div class="w-64 bg-gradient-to-b from-blue-900 to-blue-800 text-white flex flex-col flex-shrink-0 shadow-xl">
      <div class="p-6 border-b border-blue-700">
        <h1 class="text-2xl font-bold">🏫 مدرسة النور</h1>
        <p class="text-blue-200 text-xs mt-1">نظام الإدارة المتكامل</p>
      </div>
      <nav class="mt-4 flex-1 text-sm overflow-y-auto" id="sidebar-nav"></nav>
      <div class="p-4 border-t border-blue-700 bg-blue-900/50">
        <div class="flex items-center mb-3">
          <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-lg shadow">👤</div>
          <div class="mr-3 flex-1 overflow-hidden">
            <p class="text-sm font-semibold truncate" id="user-name">المستخدم</p>
            <span class="text-[10px] bg-yellow-500 text-black px-2 py-0.5 rounded-full font-bold" id="user-role">مدير</span>
          </div>
        </div>
        <button onclick="logout()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg text-sm font-semibold transition flex items-center justify-center gap-2">
          <span>🚪</span> تسجيل الخروج
        </button>
      </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="flex-1 overflow-auto bg-gray-50">
      <div class="bg-white shadow-sm px-6 py-4 sticky top-0 z-10 flex justify-between items-center">
        <h2 id="page-title" class="text-2xl font-bold text-gray-800">لوحة التحكم</h2>
        <span class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full" id="current-date"></span>
      </div>

      <!-- حاوية الصفحات الديناميكية -->
      <div id="main-content" class="p-6">
        <!-- سيتم حقن المحتوى هنا تلقائياً بواسطة JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // 1. التحقق الأمني من الدخول
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    if (!currentUser || !currentUser.role) {
      window.location.href = '/login';
    }
    const userRole = currentUser.role;
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    // 2. تعريف القوائم والصلاحيات
    const menuItems = {
      'مدير': [
        {id:'dashboard', icon:'📊', label:'لوحة التحكم'}, 
        {id:'students', icon:'👥', label:'الطلاب'}, 
        {id:'teachers', icon:'👨‍🏫', label:'المعلمون'}, 
        {id:'parents', icon:'👨‍👩‍👧', label:'أولياء الأمور'},
        {id:'attendance', icon:'📅', label:'الحضور والغياب'},
        {id:'fees', icon:'💰', label:'الرسوم الدراسية'},
        {id:'revenue', icon:'💵', label:'الإيرادات'},
        {id:'expenses', icon:'💸', label:'المصروفات'},
        {id:'reports', icon:'📄', label:'التقارير'}
      ],
      'تسجيل الطلاب': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'}, {id:'students', icon:'👥', label:'الطلاب'}, {id:'parents', icon:'👨‍👩‍👧', label:'أولياء الأمور'}, {id:'attendance', icon:'📅', label:'الحضور'}],
      'الشؤون المالية': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'}, {id:'fees', icon:'💰', label:'الرسوم'}, {id:'revenue', icon:'💵', label:'الإيرادات'}, {id:'expenses', icon:'💸', label:'المصروفات'}],
      'التقارير': [{id:'dashboard', icon:'📊', label:'لوحة التحكم'}, {id:'reports', icon:'📄', label:'التقارير'}]
    };

    // 3. المحرك الديناميكي: إعدادات كل جدول (الأعمدة والنموذج)
    const tableConfigs = {
      students: { 
        title: 'الطلاب', 
        columns: [{key:'name', label:'الاسم'}, {key:'grade', label:'الصف'}, {key:'section', label:'الشعبة'}, {key:'status', label:'الحالة'}],
        form: [{name:'name', label:'اسم الطالب', type:'text'}, {name:'grade', label:'الصف', type:'text'}, {name:'section', label:'الشعبة', type:'text'}, {name:'status', label:'الحالة', type:'select', options:['نشط','متوقف']}]
      },
      teachers: { 
        title: 'المعلمون', 
        columns: [{key:'name', label:'الاسم'}, {key:'subject', label:'المادة'}, {key:'phone', label:'الهاتف'}, {key:'salary', label:'الراتب'}],
        form: [{name:'name', label:'اسم المعلم', type:'text'}, {name:'subject', label:'المادة', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'salary', label:'الراتب', type:'number'}]
      },
      parents: { 
        title: 'أولياء الأمور', 
        columns: [{key:'name', label:'الاسم'}, {key:'phone', label:'الهاتف'}, {key:'email', label:'البريد'}],
        form: [{name:'name', label:'اسم ولي الأمر', type:'text'}, {name:'phone', label:'الهاتف', type:'text'}, {name:'email', label:'البريد الإلكتروني', type:'email'}]
      },
      attendance: { 
        title: 'الحضور والغياب', 
        columns: [{key:'student_name', label:'اسم الطالب'}, {key:'date', label:'التاريخ'}, {key:'status', label:'الحالة'}],
        form: [{name:'student_name', label:'اسم الطالب', type:'text'}, {name:'date', label:'التاريخ', type:'date'}, {name:'status', label:'الحالة', type:'select', options:['present','absent','late']}]
      },
      fees: { 
        title: 'الرسوم الدراسية', 
        columns: [{key:'student_name', label:'اسم الطالب'}, {key:'amount', label:'المبلغ'}, {key:'status', label:'الحالة'}, {key:'date', label:'التاريخ'}],
        form: [{name:'student_name', label:'اسم الطالب', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'status', label:'الحالة', type:'select', options:['paid','unpaid']}, {name:'date', label:'التاريخ', type:'date'}]
      },
      revenue: { 
        title: 'الإيرادات', 
        columns: [{key:'source', label:'المصدر'}, {key:'amount', label:'المبلغ'}, {key:'date', label:'التاريخ'}],
        form: [{name:'source', label:'مصدر الإيراد', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'date', label:'التاريخ', type:'date'}]
      },
      expenses: { 
        title: 'المصروفات', 
        columns: [{key:'category', label:'البند'}, {key:'amount', label:'المبلغ'}, {key:'date', label:'التاريخ'}],
        form: [{name:'category', label:'بند الصرف', type:'text'}, {name:'amount', label:'المبلغ', type:'number'}, {name:'date', label:'التاريخ', type:'date'}]
      }
    };

    let currentTable = null;

    // 4. بناء الواجهة
    function buildSidebar() {
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-role').textContent = userRole;
      
      const nav = document.getElementById('sidebar-nav');
      const items = menuItems[userRole] || menuItems['مدير'];
      
      nav.innerHTML = items.map((item, i) => 
        `<a onclick="showPage('${item.id}')" class="nav-item ${i===0?'active':''} flex items-center px-6 py-3 text-blue-100">
          <span class="ml-3 text-lg">${item.icon}</span> ${item.label}
        </a>`
      ).join('');
    }

    function showPage(pageId) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const activeLink = Array.from(document.querySelectorAll('.nav-item')).find(a => a.textContent.includes(
        (menuItems[userRole] || menuItems['مدير']).find(m => m.id === pageId)?.label || ''
      ));
      if (activeLink) activeLink.classList.add('active');

      const contentDiv = document.getElementById('main-content');
      const titles = {dashboard:'لوحة التحكم', reports:'التقارير'};
      document.getElementById('page-title').textContent = titles[pageId] || tableConfigs[pageId]?.title || '';

      if (pageId === 'dashboard') {
        contentDiv.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-blue-500"><p class="text-gray-500 text-sm">إجمالي الطلاب</p><p class="text-3xl font-bold mt-2 text-gray-800" id="dash-students">...</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-green-500"><p class="text-gray-500 text-sm">المعلمون</p><p class="text-3xl font-bold mt-2 text-gray-800" id="dash-teachers">...</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-yellow-500"><p class="text-gray-500 text-sm">الإيرادات</p><p class="text-3xl font-bold mt-2 text-gray-800" id="dash-revenue">...</p></div>
            <div class="bg-white rounded-xl shadow-sm p-6 border-r-4 border-purple-500"><p class="text-gray-500 text-sm">المصروفات</p><p class="text-3xl font-bold mt-2 text-gray-800" id="dash-expenses">...</p></div>
          </div>`;
        loadDashboard();
      } 
      else if (pageId === 'reports') {
        contentDiv.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-xl font-bold mb-6">📄 التقارير المتاحة</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              <a href="/api/reports/students" target="_blank" class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-6 rounded-xl hover:shadow-lg transition flex items-center gap-4">
                <span class="text-4xl">👥</span>
                <div><h4 class="font-bold text-lg">تقرير الطلاب</h4><p class="text-sm opacity-90">عرض وطباعة بيانات الطلاب</p></div>
              </a>
            </div>
          </div>`;
      }
      else if (tableConfigs[pageId]) {
        currentTable = pageId;
        const config = tableConfigs[pageId];
        contentDiv.innerHTML = `
          <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
              <h3 class="text-xl font-bold">إدارة ${config.title}</h3>
              <button onclick="openModal()" class="btn-add">+ إضافة جديد</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-gray-50"><tr>
                  ${config.columns.map(c => `<th class="px-4 py-3 text-right">${c.label}</th>`).join('')}
                  <th class="px-4 py-3 text-right">الإجراءات</th>
                </tr></thead>
                <tbody id="dynamic-table-body">
                  <tr><td colspan="100" class="text-center py-8 text-gray-500">جاري تحميل البيانات...</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
        loadData(pageId);
      }
    }

    // 5. دالة جلب البيانات (مع إرسال الصلاحية)
    async function loadData(table) {
      try {
        const res = await fetch(`/api/${table}`, { headers: { 'x-user-role': userRole } });
        const data = await res.json();
        
        if (!data.success) {
          document.getElementById('dynamic-table-body').innerHTML = `<tr><td colspan="100" class="text-center py-8 text-red-500 font-bold">⛔ ${data.message}</td></tr>`;
          return;
        }

        const config = tableConfigs[table];
        if (data.data.length === 0) {
          document.getElementById('dynamic-table-body').innerHTML = `<tr><td colspan="100" class="text-center py-8 text-gray-500">لا توجد بيانات لعرضها</td></tr>`;
          return;
        }

        document.getElementById('dynamic-table-body').innerHTML = data.data.map(row => `
          <tr class="border-b hover:bg-gray-50 transition">
            ${config.columns.map(c => `<td class="px-4 py-3">${row[c.key] || '-'}</td>`).join('')}
            <td class="px-4 py-3">
              <button onclick="deleteItem('${table}', ${row.id})" class="btn-action btn-delete">🗑️ حذف</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('dynamic-table-body').innerHTML = `<tr><td colspan="100" class="text-center py-8 text-red-500">❌ خطأ في الاتصال</td></tr>`;
      }
    }

    async function loadDashboard() {
      // جلب أرقام سريعة للوحة التحكم
      const tablesToCheck = ['students', 'teachers', 'revenue', 'expenses'];
      for (const t of tablesToCheck) {
        try {
          const res = await fetch(`/api/${t}`, { headers: { 'x-user-role': userRole } });
          const data = await res.json();
          if (data.success) {
            const el = document.getElementById(`dash-${t}`);
            if (el) {
              if (t === 'revenue' || t === 'expenses') {
                const total = data.data.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                el.textContent = total.toLocaleString() + ' جنيه';
              } else {
                el.textContent = data.count;
              }
            }
          }
        } catch(e) {}
      }
    }

    // 6. إدارة النافذة المنبثقة (Modal)
    function openModal() {
      const config = tableConfigs[currentTable];
      document.getElementById('modal-title').textContent = `إضافة ${config.title.replace('إدارة ', '')}`;
      
      document.getElementById('modal-form').innerHTML = config.form.map(f => {
        if (f.type === 'select') {
          return `<label class="block text-sm font-semibold text-gray-700 mb-1">${f.label} *</label>
                  <select name="${f.name}" class="form-input" required>${f.options.map(o => `<option value="${o}">${o}</option>`).join('')}</select>`;
        }
        return `<label class="block text-sm font-semibold text-gray-700 mb-1">${f.label} *</label>
                <input type="${f.type}" name="${f.name}" class="form-input" required>`;
      }).join('') + `<div class="flex gap-3 mt-6">
        <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">💾 حفظ البيانات</button>
        <button type="button" onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300 transition">إلغاء</button>
      </div>`;
      
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    // 7. معالجة الإرسال والحذف
    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {}; formData.forEach((v, k) => data[k] = v);
      
      try {
        const res = await fetch(`/api/${currentTable}`, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json', 'x-user-role': userRole }, 
          body: JSON.stringify(data) 
        });
        const result = await res.json();
        
        if (result.success) {
          showToast('✅ تمت الإضافة بنجاح');
          closeModal();
          loadData(currentTable);
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) {
        showToast('❌ خطأ في الاتصال بالخادم', 'error');
      }
    });

    async function deleteItem(table, id) {
      if (!confirm('هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذا الإجراء.')) return;
      try {
        const res = await fetch(`/api/${table}/${id}`, { method: 'DELETE', headers: { 'x-user-role': userRole } });
        const result = await res.json();
        if (result.success) { 
          showToast('🗑️ تم الحذف بنجاح'); 
          loadData(table); 
        } else {
          showToast('❌ ' + result.message, 'error');
        }
      } catch (err) {
        showToast('❌ خطأ في الحذف', 'error');
      }
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; 
      t.style.background = type === 'success' ? '#10b981' : '#ef4444';
      t.classList.add('show'); 
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() { 
      if(confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem('user'); 
        window.location.href = '/login'; 
      }
    }

    // التشغيل الأولي
    buildSidebar();
    showPage('dashboard');
  </script>
</body>
</html>
