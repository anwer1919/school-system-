<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مدرسة النور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  
  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-blue-100 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">🏫</div>
      <h1 class="text-3xl font-bold text-gray-800">مدرسة النور</h1>
      <p class="text-gray-500 mt-2">نظام الإدارة المتكامل</p>
    </div>

    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-gray-700 font-semibold mb-2">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition" placeholder="admin@school.com">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition" placeholder="••••••••">
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition transform hover:scale-[1.02]">
        تسجيل الدخول
      </button>
    </form>

    <div id="errorMessage" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center">
      ❌ البريد الإلكتروني أو كلمة المرور غير صحيحة
    </div>

    <div class="mt-8 p-4 bg-blue-50 rounded-lg border border-blue-100">
      <p class="text-sm font-bold text-blue-900 mb-2">🔑 بيانات الدخول التجريبية:</p>
      <p class="text-xs text-blue-700 mb-1">البريد: <code class="bg-white px-2 py-1 rounded border">admin@school.com</code></p>
      <p class="text-xs text-blue-700">كلمة المرور: <code class="bg-white px-2 py-1 rounded border">admin123</code></p>
    </div>
  </div>

  <script>
    // إذا كان مسجلاً بالفعل، وجهه للوحة التحكم
    if (localStorage.getItem('user')) {
      window.location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMessage');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'جاري التحقق...';
      errorMsg.classList.add('hidden');
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('user', JSON.stringify({
  ...data.user,
  role: data.user.role || 'مدير'
}));
          window.location.href = '/';
        } else {
          errorMsg.textContent = '❌ ' + (data.message || 'بيانات الدخول غير صحيحة');
          errorMsg.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtn.textContent = 'تسجيل الدخول';
        }
      } catch (error) {
        errorMsg.textContent = '❌ حدث خطأ في الاتصال بالخادم';
        errorMsg.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
