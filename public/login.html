<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مدرسة النور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
  <div class="login-card w-full max-w-md rounded-2xl shadow-2xl p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-purple-600 rounded-full mx-auto flex items-center justify-center text-4xl mb-4">
        🏫
      </div>
      <h1 class="text-3xl font-bold text-gray-800">مدرسة النور</h1>
      <p class="text-gray-600 mt-2">نظام الإدارة المتكامل</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-gray-700 font-semibold mb-2">البريد الإلكتروني</label>
        <input 
          type="email" 
          id="email" 
          required
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition"
          placeholder="admin@school.com"
        >
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">كلمة المرور</label>
        <input 
          type="password" 
          id="password" 
          required
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none transition"
          placeholder="••••••••"
        >
      </div>

      <div class="flex items-center justify-between">
        <label class="flex items-center">
          <input type="checkbox" class="w-4 h-4 text-blue-600 rounded">
          <span class="mr-2 text-sm text-gray-600">تذكرني</span>
        </label>
        <a href="#" class="text-sm text-blue-600 hover:text-blue-800">نسيت كلمة المرور؟</a>
      </div>

      <button 
        type="submit"
        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition transform hover:scale-105"
      >
        تسجيل الدخول
      </button>
    </form>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-center">
      ❌ البريد الإلكتروني أو كلمة المرور غير صحيحة
    </div>

    <!-- Demo Credentials -->
    <div class="mt-8 p-4 bg-blue-50 rounded-lg">
      <p class="text-sm font-semibold text-blue-900 mb-2">🔑 بيانات تجريبية:</p>
      <p class="text-xs text-blue-700">البريد: <code class="bg-white px-2 py-1 rounded">admin@school.com</code></p>
      <p class="text-xs text-blue-700">كلمة المرور: <code class="bg-white px-2 py-1 rounded">admin123</code></p>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-sm text-gray-600">
      <p>© 2026 مدرسة النور الخاصة. جميع الحقوق محفوظة.</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      
      errorMsg.classList.add('hidden');
      
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          // حفظ بيانات المستخدم
          localStorage.setItem('user', JSON.stringify(data.user));
          // الانتقال للوحة التحكم
          window.location.href = '/';
        } else {
          errorMsg.classList.remove('hidden');
        }
      } catch (error) {
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
